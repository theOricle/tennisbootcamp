name: Voice Task

# Dispatched by the Cloudflare Worker (ops/voice/bridge) when Sina sends a
# voice memo or text task in Telegram. Runs Claude Code on a fresh Ubuntu
# runner, opens a PR on a feature branch, and notifies the Worker so the
# bot can ping Sina with [MERGE] [CLOSE] [HOLD] buttons.

on:
  workflow_dispatch:
    inputs:
      title:
        description: "PR title (max 60 chars)"
        required: true
        type: string
      description:
        description: "Full task description for Claude Code"
        required: true
        type: string
      branch:
        description: "Feature branch name (must start with voice/)"
        required: true
        type: string
      complexity:
        description: "simple | medium | complex (routes Sonnet vs Haiku)"
        required: false
        default: "medium"
        type: string

concurrency:
  group: voice-task-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: read

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKER_CALLBACK_URL: ${{ secrets.WORKER_CALLBACK_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TASK_TITLE: ${{ inputs.title }}
      TASK_DESCRIPTION: ${{ inputs.description }}
      TASK_BRANCH: ${{ inputs.branch }}
      TASK_COMPLEXITY: ${{ inputs.complexity }}

    steps:
      - name: Validate branch name
        run: |
          if [[ ! "$TASK_BRANCH" =~ ^voice/ ]]; then
            echo "::error::branch must start with 'voice/', got: $TASK_BRANCH"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject if task touches protected paths
        run: |
          # Server-side echo of the Worker's blocklist. Last line of defense.
          BAD_PATTERNS='(/api/intake|\.env(\.|$)|\bsecret|force[- ]push|rm -rf|drop table|truncate|\.github/workflows|\.claude/memory)'
          if echo "$TASK_DESCRIPTION" | grep -iqE "$BAD_PATTERNS"; then
            echo "::error::Task description mentions protected paths or destructive ops. Refused."
            curl -sS -X POST "$WORKER_CALLBACK_URL/github/done/$CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg t "$TASK_TITLE" --arg b "$TASK_BRANCH" \
                '{status:"failure",title:$t,branch:$b,failed_step:"protected-paths-check",run_url:env.GITHUB_SERVER_URL+"/"+env.GITHUB_REPOSITORY+"/actions/runs/"+env.GITHUB_RUN_ID}')"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name  "tb-voice-bot"
          git config user.email "voice@tennisbootcamp.ca"

      - name: Create feature branch
        run: git checkout -b "$TASK_BRANCH"

      - name: Run Claude Code
        id: claude
        run: |
          cat > /tmp/prompt.md <<'PROMPT_EOF'
          You are running headless in a GitHub Actions runner, dispatched from a Telegram
          voice memo. The runner has the full repo checked out. You have one job: do the
          task described below, well, in one commit (or a small number of focused commits).

          ## Task

          PROMPT_EOF

          # Append the description safely (avoids YAML/shell interpolation surprises)
          printf '%s\n' "$TASK_DESCRIPTION" >> /tmp/prompt.md

          cat >> /tmp/prompt.md <<'PROMPT_EOF'

          ## Standing instructions

          1. Read these first, in order, before touching any code:
             - `CLAUDE.md`
             - `.claude/memory/PROGRESS.md`
             - `.claude/memory/DECISIONS.md`
             - `.claude/memory/OPEN_QUESTIONS.md`
             - `ops/briefs/brand.md`
             - `ops/briefs/project.md`
          2. Match the project's existing patterns: Next.js 16 App Router, TypeScript,
             Tailwind utility classes, Geist font, the `tb-gradient` and brand color
             `#B4E655`. No SaaS gradients, no glassmorphism.
          3. Run `npm run lint` and `npx tsc --noEmit` before committing. If either
             fails, fix the issues, then re-run until both pass.
          4. NEVER modify: `/api/intake`, `.env*`, `.github/workflows/`, `.claude/memory/`,
             any file under `secrets/`. The intake pipeline is a project non-negotiable.
          5. Commit messages: short title (≤50 chars), blank line, body explaining what & why.
             Do not include "Co-Authored-By".
          6. When done, exit cleanly. Do NOT push or open the PR yourself — the workflow
             will handle that.
          PROMPT_EOF

          claude -p --dangerously-skip-permissions < /tmp/prompt.md
        continue-on-error: false

      - name: Verify there are commits to push
        run: |
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "::error::Claude Code finished without making any commits."
            exit 1
          fi

      - name: Lint + typecheck (gate)
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Push branch
        run: git push origin "$TASK_BRANCH"

      - name: Open PR
        id: pr
        run: |
          PR_BODY=$(printf 'Voice-dispatched task. See `ops/plans/voice-pipeline.md` for context.\n\n---\n\n%s' "$TASK_DESCRIPTION")
          PR_URL=$(gh pr create \
            --title "$TASK_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$TASK_BRANCH")
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL"       >> "$GITHUB_OUTPUT"

      - name: Compute diff stats
        id: stats
        run: |
          STATS=$(git diff --shortstat origin/main..HEAD)
          FILES=$(echo "$STATS"  | grep -oE '[0-9]+ files? changed'   | grep -oE '[0-9]+' || echo 0)
          ADDED=$(echo "$STATS"  | grep -oE '[0-9]+ insertions?'      | grep -oE '[0-9]+' || echo 0)
          REMOVED=$(echo "$STATS" | grep -oE '[0-9]+ deletions?'      | grep -oE '[0-9]+' || echo 0)
          echo "files=$FILES"       >> "$GITHUB_OUTPUT"
          echo "added=$ADDED"       >> "$GITHUB_OUTPUT"
          echo "removed=$REMOVED"   >> "$GITHUB_OUTPUT"

      - name: Notify Worker (success)
        if: success()
        run: |
          PAYLOAD=$(jq -nc \
            --arg t   "$TASK_TITLE" \
            --arg b   "$TASK_BRANCH" \
            --arg pu  "${{ steps.pr.outputs.pr_url }}" \
            --argjson pn ${{ steps.pr.outputs.pr_number }} \
            --argjson fc ${{ steps.stats.outputs.files }} \
            --argjson la ${{ steps.stats.outputs.added }} \
            --argjson lr ${{ steps.stats.outputs.removed }} \
            '{
              status: "success",
              title: $t,
              branch: $b,
              pr_number: $pn,
              pr_url: $pu,
              files_changed: $fc,
              lines_added: $la,
              lines_removed: $lr,
              ci_status: "pending",
              preview_url: ""
            }')
          curl -sS -X POST "$WORKER_CALLBACK_URL/github/done/$CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Worker (failure)
        if: failure()
        run: |
          PAYLOAD=$(jq -nc \
            --arg t  "$TASK_TITLE" \
            --arg b  "$TASK_BRANCH" \
            --arg ru "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              status: "failure",
              title: $t,
              branch: $b,
              failed_step: "see-logs",
              run_url: $ru
            }')
          curl -sS -X POST "$WORKER_CALLBACK_URL/github/done/$CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
