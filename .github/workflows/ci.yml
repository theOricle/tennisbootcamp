name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # The build's type check loads the Google API type definitions and needs
      # about 1.8 GB, which is at the runner's default heap limit.
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
